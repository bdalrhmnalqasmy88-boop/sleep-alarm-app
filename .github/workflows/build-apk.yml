name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project folders
        run: |
          rm -rf .extract
          mkdir -p .extract

          unzip -q android.zip -d .extract/android
          unzip -q src.zip -d .extract/src
          unzip -q supabase.zip -d .extract/supabase

          mkdir -p android src supabase

          cp -a .extract/android/android/. android/
          cp -a .extract/src/src/. src/
          cp -a .extract/supabase/supabase/. supabase/

          test -f package.json
          test -d android
          test -f android/gradlew
          test -d src
          test -d supabase

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
